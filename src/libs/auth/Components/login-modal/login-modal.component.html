<div class="login-modal-content">
  <p>Please log in to continue</p>

  <div class="flex justify-content-end gap-2 mt-4">
    <button
      pButton
      type="button"
      label="Cancel"
      class="p-button-secondary"
      (click)="close()"
      [disabled]="isLoading"
    ></button>
    <button
      pButton
      type="button"
      label="Login with Google"
      class="p-button-primary"
      icon="pi pi-google"
      (click)="loginWithGoogle()"
      [loading]="isLoading"
    ></button>
  </div>
  
  @if (isLoading) {
    <p class="text-center mt-3 text-color-secondary">
      Complete login in popup window...
    </p>
  }
</div>
