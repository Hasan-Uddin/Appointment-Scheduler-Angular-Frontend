<form
    [formGroup]="formService.form"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4 p-6">
    <!-- Name -->
    <div class="flex flex-col gap-2">
        <label for="name" class="text-sm font-medium text-gray-700">
            Name <span class="text-red-500">*</span>
        </label>
        <input
            id="name"
            pInputText
            formControlName="name"
            placeholder="30-Minute Consultation"
            class="w-full" />
        @if (
            formService.controls('name')?.invalid &&
            formService.controls('name')?.touched
        ) {
            <small class="text-red-500"
                >Name is required (max 100 characters)</small
            >
        }
    </div>

    <!-- Slug -->
    <div class="flex flex-col gap-2">
        <label for="slug" class="text-sm font-medium text-gray-700">
            URL Slug <span class="text-red-500">*</span>
        </label>
        <div class="flex items-center">
            <span class="mr-2 text-gray-500">/book/</span>
            <input
                id="slug"
                pInputText
                formControlName="slug"
                placeholder="consultation-30"
                class="flex-1" />
        </div>
        @if (
            formService.controls('slug')?.invalid &&
            formService.controls('slug')?.touched
        ) {
            <small class="text-red-500"
                >Only lowercase letters, numbers, and hyphens</small
            >
        }
    </div>

    <!-- Description -->
    <div class="flex flex-col gap-2">
        <label for="description" class="text-sm font-medium text-gray-700">
            Description
        </label>
        <textarea
            id="description"
            pInputTextarea
            formControlName="description"
            placeholder="Brief description..."
            rows="3"
            class="w-full"></textarea>
    </div>

    <!-- Duration -->
    <div class="flex flex-col gap-2">
        <label for="duration" class="text-sm font-medium text-gray-700">
            Duration <span class="text-red-500">*</span>
        </label>
        <p-inputNumber
            inputId="duration"
            formControlName="durationMinutes"
            [min]="5"
            [max]="480"
            [step]="5"
            suffix=" min"
            class="w-full" />
    </div>
    <!-- Color -->
    <div class="flex flex-col gap-2">
        <label for="color" class="text-sm font-medium text-gray-700">
            Color
        </label>
        <p-colorPicker formControlName="color" />
    </div>

    <!-- Actions -->
    <div class="mt-2 flex justify-end gap-2 border-t pt-4">
        <p-button
            label="Cancel"
            severity="secondary"
            [outlined]="true"
            (onClick)="cancel()"
            [disabled]="loading" />
        <p-button label="Create" type="submit" [loading]="loading" />
    </div>
</form>
