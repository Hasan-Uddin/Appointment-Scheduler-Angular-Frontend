<div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5">
    <div class="flex items-center justify-between mb-3">
        <div>
            <h3 class="text-base font-semibold text-gray-900">Select a time</h3>
            <p class="text-xs text-gray-500">
                {{ formatDate(selectedDate) }}
            </p>
        </div>
        <button
            type="button"
            class="text-xs text-gray-500 hover:text-gray-700"
            (click)="back.emit()">
            ← Back to dates
        </button>
    </div>

    @if (loading) {
        <div class="space-y-2">
            @for (i of [1, 2, 3, 4, 5]; track i) {
                <div class="h-10 bg-gray-100 rounded animate-pulse"></div>
            }
        </div>
    } @else if (availableSlots.length > 0) {
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 max-h-[320px] overflow-y-auto">
            @for (slot of availableSlots; track slot.startTime) {
                <button
                    type="button"
                    (click)="onSlotClick(slot)"
                    class="px-3 py-2 rounded-md text-sm border-2 transition-all"
                    [ngClass]="{
                        'border-blue-600 bg-blue-50 text-blue-700':
                            isSelected(slot),
                        'border-gray-200 bg-white text-gray-700 hover:border-blue-400 hover:bg-blue-50':
                            !isSelected(slot)
                    }">
                    {{ formatTime(slot.startTime) }}
                </button>
            }
        </div>
    } @else {
        <div class="text-center py-10">
            <i class="pi pi-calendar-times text-4xl text-gray-300 mb-3"></i>
            <p class="text-gray-600 text-sm">No available time slots for this day.</p>
        </div>
    }
</div>
