<div class="bg-white rounded-lg border border-gray-200 shadow-sm">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-200 px-4 py-3">
        <p-button
            icon="pi pi-chevron-left"
            [rounded]="true"
            [text]="true"
            (onClick)="previousMonth.emit()"
            [disabled]="loading" />

        <h3 class="text-base font-semibold text-gray-900">
            {{ monthLabel }}
        </h3>

        <p-button
            icon="pi pi-chevron-right"
            [rounded]="true"
            [text]="true"
            (onClick)="nextMonth.emit()"
            [disabled]="loading" />
    </div>

    <!-- Weekdays -->
    <div class="grid grid-cols-7 gap-1 px-4 pt-3 pb-1 text-xs font-medium text-gray-500">
        @for (wd of weekDays; track wd) {
            <div class="text-center">{{ wd }}</div>
        }
    </div>

    <!-- Days -->
    <div class="grid grid-cols-7 gap-1 px-4 pb-4">
        @for (day of days; track day.date + day.dayNumber) {
            <button
                type="button"
                class="aspect-square rounded-lg text-sm flex flex-col items-center justify-center transition-all"
                [ngClass]="{
                    'bg-blue-600 text-white shadow-md': isSelected(day.date),
                    'bg-green-50 text-green-900 border border-green-200 hover:bg-green-100':
                        !isSelected(day.date) && day.isCurrentMonth && day.hasSlots && !day.isPast,
                    'text-gray-400 cursor-not-allowed':
                        day.isCurrentMonth && (!day.hasSlots || day.isPast),
                    'text-gray-300': !day.isCurrentMonth
                }"
                [disabled]="!day.isCurrentMonth || !day.hasSlots || day.isPast || loading"
                (click)="onDayClick(day)">
                @if (day.dayNumber > 0) {
                    <span class="font-medium">{{ day.dayNumber }}</span>

                    @if (day.hasSlots && !day.isPast && day.isCurrentMonth) {
                        <span class="mt-1 text-[10px]"
                            [ngClass]="{
                                'text-white': isSelected(day.date),
                                'text-green-600': !isSelected(day.date)
                            }">
                            {{ day.slotsCount }} slots
                        </span>
                    }
                }
            </button>
        }
    </div>
</div>
